<svg xmlns="http://www.w3.org/2000/svg" width="640" height="220" viewBox="0 0 640 220" font-family="sans-serif" font-size="13">
  <title>JWT authentication flow</title>
  <desc>Sequence diagram: the client sends credentials to the auth service, receives an access token and a refresh token, then calls the Notes API through the gateway with a Bearer token that the auth middleware validates.</desc>
  <rect x="10" y="80" width="110" height="50" rx="8" fill="#e8f0fe" stroke="#1f6feb"/>
  <text x="65" y="110" text-anchor="middle">Client</text>
  <rect x="180" y="20" width="130" height="50" rx="8" fill="#eef3ea" stroke="#2e7d32"/>
  <text x="245" y="50" text-anchor="middle">Auth service</text>
  <rect x="180" y="140" width="130" height="50" rx="8" fill="#fff4e5" stroke="#ef6c00"/>
  <text x="245" y="170" text-anchor="middle">API gateway</text>
  <rect x="400" y="140" width="150" height="50" rx="8" fill="#f3e5f5" stroke="#8e24aa"/>
  <text x="475" y="170" text-anchor="middle">Notes API + auth middleware</text>
  <line x1="120" y1="95" x2="180" y2="50" stroke="#555" marker-end="url(#a)"/>
  <text x="95" y="60">POST /auth/token</text>
  <line x1="120" y1="115" x2="180" y2="165" stroke="#555"/>
  <text x="70" y="160">Bearer access token</text>
  <line x1="310" y1="165" x2="400" y2="165" stroke="#555"/>
  <text x="325" y="155">validate JWT (RS256)</text>
</svg>
