<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmniRAG</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --border: #e3e2dd;
    --accent: #1f6feb; --accent-soft: #e8f0fe; --code: #f2f1ed; --user: #eef3ea;
    --text-m: #2e7d32; --image-m: #8e24aa; --audio-m: #ef6c00; --code-m: #1565c0; --table-m: #00838f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151515; --panel: #1e1e1e; --text: #e8e8e3; --muted: #9a9a93; --border: #333331;
      --accent: #6ea8fe; --accent-soft: #1c2a40; --code: #262624; --user: #1f2a1e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 20px;
           border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { font-size: 17px; margin: 0 8px 0 0; letter-spacing: .2px; }
  header .stat { color: var(--muted); font-size: 13px; }
  header label { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  select, input, button, textarea { font: inherit; color: inherit; }
  select, input[type=number], input[type=text] { background: var(--bg); border: 1px solid var(--border);
         border-radius: 6px; padding: 4px 8px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; height: calc(100vh - 58px); }
  #chat { display: flex; flex-direction: column; min-width: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 20px; }
  .msg { max-width: 860px; margin: 0 auto 18px; padding: 12px 16px; border-radius: 10px;
         background: var(--panel); border: 1px solid var(--border); }
  .msg.user { background: var(--user); }
  .msg .meta { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .msg .warn { font-size: 12px; color: #b26a00; margin-top: 6px; }
  .msg ul { padding-left: 20px; margin: 6px 0; }
  .msg pre { background: var(--code); padding: 10px 12px; border-radius: 6px; overflow-x: auto; font-size: 13px; }
  .msg code { background: var(--code); padding: 1px 4px; border-radius: 4px; font-size: 13px; }
  .msg pre code { background: none; padding: 0; }
  .cite { border: none; background: var(--accent-soft); color: var(--accent); border-radius: 4px;
          padding: 0 5px; margin: 0 1px; cursor: pointer; font-size: 12px; font-weight: 600; }
  .sources { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { border: 1px solid var(--border); background: var(--bg); border-radius: 999px; padding: 2px 10px;
          font-size: 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .chip.cited { border-color: var(--accent); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .m-text { background: var(--text-m); } .m-image { background: var(--image-m); }
  .m-audio { background: var(--audio-m); } .m-code { background: var(--code-m); } .m-table { background: var(--table-m); }
  form#ask { display: flex; gap: 8px; padding: 12px 20px 16px; border-top: 1px solid var(--border); background: var(--panel); }
  form#ask textarea { flex: 1; resize: none; height: 46px; border: 1px solid var(--border); border-radius: 8px;
                      padding: 10px 12px; background: var(--bg); }
  .btn { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 0 18px; cursor: pointer; }
  .btn:disabled { opacity: .6; cursor: default; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 20px 0; background: var(--panel); }
  .filters .chip.on { background: var(--accent-soft); border-color: var(--accent); }
  aside { border-left: 1px solid var(--border); background: var(--panel); overflow-y: auto; padding: 16px; }
  aside h2 { font-size: 15px; margin: 0 0 4px; }
  aside .path { color: var(--muted); font-size: 12px; word-break: break-all; }
  aside pre { white-space: pre-wrap; word-break: break-word; background: var(--code); padding: 10px;
              border-radius: 6px; font-size: 12.5px; }
  aside .ctx { opacity: .6; }
  aside img { max-width: 100%; border: 1px solid var(--border); border-radius: 6px; background: #fff; }
  aside table { font-size: 12px; border-collapse: collapse; width: 100%; }
  aside td { border-top: 1px solid var(--border); padding: 3px 4px; vertical-align: top; word-break: break-word; }
  .empty { color: var(--muted); font-size: 14px; }
  details { font-size: 13px; color: var(--muted); }
  details form { display: flex; gap: 6px; margin-top: 6px; }
  details input { flex: 1; }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; height: auto; }
    #messages { min-height: 55vh; }
    aside { border-left: none; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>
<header>
  <h1>OmniRAG</h1>
  <label>Knowledge base <select id="kb"></select></label>
  <label>LLM
    <select id="llm">
      <option value="">server default</option>
      <option value="none">none (extractive)</option>
      <option value="ollama">ollama</option>
      <option value="openai">openai-compatible</option>
    </select>
  </label>
  <label>Top-k <input id="topk" type="number" min="1" max="20" value="5" style="width:60px"></label>
  <span class="stat" id="stat"></span>
</header>
<main>
  <section id="chat">
    <div id="messages">
      <div class="msg" id="welcome">
        Ask anything about the documents, code, tables, images and transcripts in this knowledge base.
        Click a <button class="cite" type="button">[1]</button> citation to preview its source.
        Inline filters work too, e.g. <code>modality:code rate limiter</code> or <code>source:*.csv latency</code>.
      </div>
    </div>
    <div class="filters" id="filters"></div>
    <form id="ask">
      <textarea id="q" placeholder="How does authentication work? (Enter to send, Shift+Enter for newline)"></textarea>
      <button class="btn" id="send" type="submit">Ask</button>
    </form>
  </section>
  <aside>
    <div id="preview"><p class="empty">Source previews appear here.</p></div>
    <details>
      <summary>Ingest files on the server</summary>
      <form id="ingest">
        <input id="ingest-path" type="text" placeholder="/path/to/folder">
        <button class="btn" type="submit">Ingest</button>
      </form>
      <div id="ingest-result"></div>
    </details>
  </aside>
</main>
<script>
const DEFAULT_KB = "__DEFAULT_KB__";
const MODALITIES = ["text", "code", "table", "image", "audio"];
const $ = (id) => document.getElementById(id);
const active = new Set();
const answers = [];

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function renderMarkdown(text, msgId) {
  const blocks = [];
  let src = esc(text).replace(/```([\w+-]*)\n([\s\S]*?)```/g, (_, lang, code) => {
    blocks.push(`<pre><code data-lang="${lang}">${code}</code></pre>`);
    return `\u0000${blocks.length - 1}\u0000`;
  });
  src = src.replace(/`([^`\n]+)`/g, "<code>$1</code>")
           .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
           .replace(/\[(\d+)\]/g, `<button type="button" class="cite" data-msg="${msgId}" data-n="$1">$1</button>`);
  const out = [];
  let list = false;
  for (const line of src.split("\n")) {
    const m = line.match(/^\s*[-*]\s+(.*)$/);
    if (m) { if (!list) { out.push("<ul>"); list = true; } out.push(`<li>${m[1]}</li>`); continue; }
    if (list) { out.push("</ul>"); list = false; }
    const h = line.match(/^#{1,4}\s+(.*)$/);
    if (h) out.push(`<strong>${h[1]}</strong><br>`);
    else if (line.trim()) out.push(line + "<br>");
  }
  if (list) out.push("</ul>");
  return out.join("\n").replace(/\u0000(\d+)\u0000(<br>)?/g, (_, i) => blocks[+i]);
}

function addMessage(html, cls) {
  const div = document.createElement("div");
  div.className = "msg " + (cls || "");
  div.innerHTML = html;
  $("messages").appendChild(div);
  $("messages").scrollTop = $("messages").scrollHeight;
  return div;
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail || res.statusText);
  return body;
}

async function loadKbs() {
  try {
    const kbs = await api("/api/kbs");
    const sel = $("kb");
    sel.innerHTML = "";
    const names = kbs.map((k) => k.name);
    if (!names.includes(DEFAULT_KB)) names.unshift(DEFAULT_KB);
    for (const name of names) {
      const o = document.createElement("option");
      o.value = o.textContent = name;
      if (name === DEFAULT_KB) o.selected = true;
      sel.appendChild(o);
    }
    await loadStats();
  } catch (e) { $("stat").textContent = "error: " + e.message; }
}

async function loadStats() {
  try {
    const s = await api(`/api/kbs/${encodeURIComponent($("kb").value)}/stats`);
    const mods = Object.entries(s.by_modality).map(([m, n]) => `${m} ${n}`).join(", ");
    $("stat").textContent = `${s.documents} docs, ${s.chunks} chunks (${mods || "empty"}) - ${s.embedder}`;
  } catch (e) { $("stat").textContent = e.message; }
}

function renderFilters() {
  const box = $("filters");
  box.innerHTML = "";
  for (const m of MODALITIES) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip" + (active.has(m) ? " on" : "");
    b.innerHTML = `<span class="dot m-${m}"></span>${m}`;
    b.onclick = () => { active.has(m) ? active.delete(m) : active.add(m); renderFilters(); };
    box.appendChild(b);
  }
}

async function ask(question) {
  addMessage(esc(question), "user");
  const pending = addMessage('<span class="empty">Thinking...</span>');
  $("send").disabled = true;
  try {
    const body = {
      query: question, kb: $("kb").value, top_k: +$("topk").value || 5,
      llm: $("llm").value || null, modalities: active.size ? [...active] : null,
    };
    const a = await api("/api/query", {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body),
    });
    const id = answers.push(a) - 1;
    const chips = a.sources.map((s) =>
      `<button type="button" class="chip ${a.cited.includes(s.index) ? "cited" : ""}" data-msg="${id}" data-n="${s.index}">
         <span class="dot m-${esc(s.modality)}"></span>[${s.index}] ${esc(s.metadata.path || s.label)}</button>`).join("");
    pending.innerHTML = renderMarkdown(a.answer, id) +
      (chips ? `<div class="sources">${chips}</div>` : "") +
      a.warnings.map((w) => `<div class="warn">${esc(w)}</div>`).join("") +
      `<div class="meta">${esc(a.backend)} - ${Math.round(a.timings.total_ms || 0)} ms - intent: ${esc(a.query.intent)}</div>`;
    const firstCited = a.cited[0] || (a.sources[0] && a.sources[0].index);
    if (firstCited) showSource(id, firstCited);
  } catch (e) {
    pending.innerHTML = `<span class="warn">Error: ${esc(e.message)}</span>`;
  } finally {
    $("send").disabled = false;
  }
}

function showSource(msgId, n) {
  const a = answers[msgId];
  const s = a && a.sources.find((x) => x.index === +n);
  if (!s) return;
  const kb = encodeURIComponent($("kb").value);
  const rows = Object.entries(s.metadata)
    .filter(([k]) => !["title"].includes(k))
    .map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(typeof v === "object" ? JSON.stringify(v) : v)}</td></tr>`).join("");
  const img = s.modality === "image"
    ? `<p><img alt="${esc(s.title)}" src="/api/kbs/${kb}/documents/${encodeURIComponent(s.doc_id)}/raw"></p>` : "";
  const before = s.context_before ? `<pre class="ctx">${esc(s.context_before)}</pre>` : "";
  const after = s.context_after ? `<pre class="ctx">${esc(s.context_after)}</pre>` : "";
  $("preview").innerHTML = `
    <h2>[${s.index}] ${esc(s.title)}</h2>
    <div class="path"><span class="dot m-${esc(s.modality)}"></span> ${esc(s.modality)} - ${esc(s.source)} ${esc(s.location)}</div>
    <p class="path">score ${s.score.toFixed(3)} - ranks ${esc(JSON.stringify(s.retrieval.ranks || {}))}</p>
    ${img}${before}<pre>${esc(s.content)}</pre>${after}
    <table>${rows}</table>`;
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-msg][data-n]");
  if (t) showSource(+t.dataset.msg, +t.dataset.n);
});
$("ask").addEventListener("submit", (e) => {
  e.preventDefault();
  const q = $("q").value.trim();
  if (q) { $("q").value = ""; ask(q); }
});
$("q").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("ask").requestSubmit(); }
});
$("kb").addEventListener("change", loadStats);
$("ingest").addEventListener("submit", async (e) => {
  e.preventDefault();
  const path = $("ingest-path").value.trim();
  if (!path) return;
  $("ingest-result").textContent = "Ingesting...";
  try {
    const r = await api("/api/ingest", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({paths: [path], kb: $("kb").value}),
    });
    $("ingest-result").textContent =
      `${r.added.length} added, ${r.updated.length} updated, ${r.unchanged.length} unchanged, ${Object.keys(r.failed).length} failed`;
    loadStats();
  } catch (err) { $("ingest-result").textContent = "Error: " + err.message; }
});
renderFilters();
loadKbs();
</script>
</body>
</html>
